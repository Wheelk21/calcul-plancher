<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1b33" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Calcul Plancher" />
<link rel="manifest" href="./manifest.json?v=10" />
<link rel="apple-touch-icon" href="./icons/icon-192.png?v=10" />
<link rel="icon" type="image/png" href="./favicon.png?v=10" />
<title>Les Rames</title>
<link rel="stylesheet" href="./css/style.css?v=11" />
</head>
<body>
<main class="app">
<header class="header"><div class="logo-wrap"><img src="./icons/logo-sncf.png?v=9" class="logo-img" /></div><div><h1 class="brand" aria-label="Les Rames"><span class="brand-eyebrow" aria-hidden="true">LES</span><span class="brand-title" aria-hidden="true">RAMES</span></h1><p>Calculateur + rapport journalier.</p></div></header>
<nav class="tabs"><button id="tab-calculateur" class="tab active" type="button">Calculateur</button><button id="tab-wagons" class="tab" type="button">Wagons</button></nav>

<section id="page-calculateur" class="page active">
<section class="card">
<label for="largeur">Largeur maximum en mm</label>
<input id="largeur" inputmode="numeric" pattern="[0-9]*" placeholder="Ex : 744" autofocus />
<div class="hint">Affichage 240 / 210 / 170, calcul selon tailles réelles ci-dessous</div>
<div class="checks-title">Planches disponibles</div>
<div id="planches" class="checks"></div>

<div class="checks-title">Tailles réelles du lot</div>
<div id="taillesReelles" class="real-sizes"></div>

</section>
<section id="resultats" class="results hidden"></section>
</section>

<section id="page-wagons" class="page">
<section class="card">
<button id="copierRapportBtn" class="secondary" type="button">Copier le rapport du jour</button>
</section>
<section class="card">
<h2 class="section-title">Nouveau wagon</h2>
<label for="wagonType">Type de wagon</label>
<input id="wagonType" type="text" placeholder="Ex : Tombereau" />
<label for="wagonNumeroSerie">N° de série</label>
<input id="wagonNumeroSerie" type="text" placeholder="Ex : 318745" />
<label for="wagonInterventions">Interventions prévues (une par ligne)</label>
<textarea id="wagonInterventions" rows="4" placeholder="Colle ou saisis la liste, une intervention par ligne"></textarea>
<button id="creerWagonBtn" class="primary" type="button">Créer le wagon</button>
</section>
<section id="wagonsListe" class="wagon-list"></section>
</section>

<section id="page-wagon-detail" class="page">
<section class="card">
<div class="detail-header">
<h2 id="detailTitre" class="section-title"></h2>
<span id="detailBadge" class="badge"></span>
</div>
<button id="detailRetour" class="secondary" type="button">← Retour aux wagons</button>
<button id="detailToggleStatut" class="secondary" type="button"></button>
<label>Planches changées</label>
<div class="counter"><button id="detailMoinsPlanche" type="button">−</button><input id="detailNbPlanches" inputmode="numeric" pattern="[0-9]*" value="0" /><button id="detailPlusPlanche" type="button">+</button></div>
<div class="checks-title">Interventions</div>
<div id="detailInterventions" class="checks"></div>
<label for="detailNouvelleIntervention">Ajouter une intervention imprévue</label>
<input id="detailNouvelleIntervention" type="text" placeholder="Ex : Planche fissurée détectée" />
<button id="detailAjouterIntervention" class="secondary" type="button">Ajouter</button>
<label for="detailCommentaire">Commentaire</label>
<textarea id="detailCommentaire" rows="3" placeholder="Facultatif"></textarea>
<button id="detailAllerCalculateur" class="secondary" type="button">Ouvrir le calculateur</button>
</section>
</section>
</main>

<script src="./js/config.js?v=9"></script>
<script src="./js/storage.js?v=9"></script>
<script src="./js/algorithm.js?v=9"></script>
<script src="./js/ui.js?v=9"></script>
<script src="./js/report.js?v=12"></script>
<script src="./js/wagons.js?v=2"></script>
<script src="./js/app.js?v=11"></script>
</body>
</html>
