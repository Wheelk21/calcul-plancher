<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1b33" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Calcul Plancher" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Calcul Plancher</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">CP</div>
      <div>
        <h1>Calcul Plancher</h1>
        <p>Calcul sans dépassement avec 2 alternatives conformes.</p>
      </div>
    </header>

    <section class="card input-card">
      <label for="largeur">Largeur maximum en mm</label>
      <input id="largeur" inputmode="numeric" pattern="[0-9]*" placeholder="Ex : 3000" autofocus />
      <div class="hint">Écart idéal : 5 mm · Tolérance : 40 mm / 3000 mm</div>
    </section>

    <section id="resultats" class="results hidden"></section>
  </main>

  <script src="./config.js"></script>
  <script src="./algorithm.js"></script>
  <script src="./app.js"></script>
</body>
</html>
